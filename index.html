<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Search Studio</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --success-color: #2ec4b6;
      --bg-color: #f7f9fc;
      --card-bg: #ffffff;
      --text-color: #2b2d42;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      margin-top: 0;
      color: var(--primary-color);
    }

    .controls {
      margin-bottom: 25px;
    }

    .btn-audio {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-audio:hover {
      background-color: #357abd;
      transform: translateY(-1px);
    }

    .btn-audio:active {
      transform: translateY(1px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .cell {
      aspect-ratio: 1;
      background-color: #edf2f7;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .cell:hover {
      background-color: #e2e8f0;
      border-color: var(--primary-color);
    }

    .cell.selected {
      background-color: var(--success-color);
      color: white;
      border-color: #259d92;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Word Search Studio</h1>
    
    <div class="controls">
      <!-- Direct trigger for your UK Phonics sound -->
      <button class="btn-audio" onclick="playPhonicsAudio()">
        🔊 Play Phonics Sound
      </button>
    </div>

    <!-- Example Interactive Grid -->
    <div class="grid" id="wordGrid">
      <div class="cell" onclick="handleCellClick(this)">A</div>
      <div class="cell" onclick="handleCellClick(this)">B</div>
      <div class="cell" onclick="handleCellClick(this)">C</div>
      <div class="cell" onclick="handleCellClick(this)">D</div>
      <div class="cell" onclick="handleCellClick(this)">E</div>
      <div class="cell" onclick="handleCellClick(this)">F</div>
      <div class="cell" onclick="handleCellClick(this)">G</div>
      <div class="cell" onclick="handleCellClick(this)">H</div>
    </div>
  </div>

  <script>
    // Keep a single global Audio instance to avoid overlapping audio glitches
    let currentPhonicsAudio = null;

    /**
     * Plays the local phonics.wav asset.
     */
    function playPhonicsAudio() {
      // 1. If audio is already playing, stop and reset it immediately
      if (currentPhonicsAudio) {
        currentPhonicsAudio.pause();
        currentPhonicsAudio.currentTime = 0;
      }

      // 2. Initialize the Audio object with the relative path
      currentPhonicsAudio = new Audio('phonics.wav');

      // 3. Trigger playback with a clean error fallback
      currentPhonicsAudio.play().catch(error => {
        console.warn("Audio play blocked or file not found:", error);
      });
    }

    /**
     * Optional Grid Helper: Plays sound on letter selection
     */
    function handleCellClick(cellElement) {
      cellElement.classList.toggle('selected');
      
      // Play the phonic sound whenever a letter cell is tapped
      playPhonicsAudio();
    }
  </script>

</body>
</html>
